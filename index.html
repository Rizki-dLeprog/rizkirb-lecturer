<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="RRB Programming Academy - platform latihan coding mandiri untuk Java, Python, Web PHP, dan C++.">
<title>RRB Academy</title>
<style>
:root{--bg:#f5f7fb;--white:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--nav:#07111f;--nav2:#0d1b2e;--blue:#0ea5e9;--blue2:#2563eb;--green:#16a34a;--purple:#7c3aed;--radius:18px;--shadow:0 12px 34px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
.top{height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#0284c7,#2563eb);display:grid;place-items:center;color:white;font-size:13px;box-shadow:0 8px 22px rgba(37,99,235,.25)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;margin-top:1px}
.progress{width:260px}.prow{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:6px}.pbar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}.pfill{height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#16a34a);transition:.3s}
.app{display:grid;grid-template-columns:335px minmax(0,1fr);min-height:calc(100vh - 72px)}aside{background:var(--nav);color:#e2e8f0;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto;padding:20px 16px 28px;border-right:1px solid #1e293b}
.label{font-size:10px;font-weight:900;letter-spacing:.15em;color:#64748b;text-transform:uppercase;margin:4px 8px 10px}.course-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.course-tab{border:1px solid #263449;background:#101b2d;color:#cbd5e1;border-radius:12px;padding:11px 8px;font-size:11px;font-weight:850}.course-tab:hover{background:#17243a}.course-tab.active{background:linear-gradient(135deg,#0369a1,#1d4ed8);border-color:#38bdf8;color:white}
.search{width:100%;border:1px solid #263449;background:#101b2d;color:#e2e8f0;border-radius:11px;padding:10px 12px;outline:none;margin-bottom:16px}.search::placeholder{color:#64748b}.search:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.modules{display:flex;flex-direction:column;gap:7px}.module-btn{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#cbd5e1;border-radius:12px;padding:11px;display:grid;grid-template-columns:34px 1fr 18px;gap:9px;align-items:start}.module-btn:hover{background:#101b2d}.module-btn.active{background:#10243c;border-color:#164e63;color:white}.mnum{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#162235;color:#38bdf8;font-size:11px;font-weight:900}.module-btn.active .mnum{background:#0ea5e9;color:white}.mtitle{font-size:13px;font-weight:850;line-height:1.35}.mcheck{color:#22c55e;font-weight:900}
main{min-width:0;padding:30px}.wrap{max-width:1180px;margin:auto}
.hero{position:relative;overflow:hidden;background:linear-gradient(130deg,#07111f,#13223b 63%,#075985);color:#fff;border-radius:24px;padding:34px;box-shadow:0 20px 50px rgba(15,23,42,.18);margin-bottom:20px}.hero:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-130px;top:-150px;background:radial-gradient(circle,rgba(56,189,248,.34),transparent 65%)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}.hero h1{margin:9px 0;font-size:clamp(34px,5vw,54px);line-height:1.03;letter-spacing:-.045em}.hero p{max-width:800px;margin:0;color:#cbd5e1;line-height:1.65}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{font-size:11px;font-weight:800;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07)}
.outline{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:20px}.outline-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:0 6px 18px rgba(15,23,42,.04);cursor:pointer;transition:.18s}.outline-item:hover{transform:translateY(-2px);border-color:#93c5fd}.outline-item.active{background:#eff6ff;border-color:#38bdf8}.onum{font-size:10px;color:#0284c7;font-weight:900}.otitle{font-size:12px;font-weight:850;margin-top:5px;line-height:1.25}
.module-head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}.module-head .small{font-size:11px;color:#0284c7;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.module-head h2{margin:6px 0 8px;font-size:30px;letter-spacing:-.03em}.module-head p{margin:0;color:#475569;line-height:1.65}.notice{margin-top:15px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px;color:#1e40af;font-size:12px;line-height:1.6}
.chapter{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}.chapter-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.chapter-head h3{margin:0 0 5px;font-size:20px}.chapter-head p{margin:0;color:#64748b;font-size:13px;line-height:1.5}.qcount{font-size:10px;font-weight:900;border-radius:999px;background:#eef2ff;color:#4338ca;padding:7px 10px;white-space:nowrap}
.question-list{padding:10px 14px 16px}.question{border:1px solid #e5e7eb;border-radius:14px;margin:9px 0;overflow:hidden;background:#fff}.qhead{width:100%;border:0;background:#fff;text-align:left;padding:14px 15px;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}.qhead:hover{background:#f8fafc}.qno{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;font-size:11px;font-weight:900;color:#475569}.qtitle{font-size:13px;font-weight:850}.qmeta{font-size:10px;color:#64748b;margin-top:3px}.arrow{color:#94a3b8;font-size:12px;transition:.2s}.question.open .arrow{transform:rotate(180deg)}
.qbody{display:none;padding:0 15px 16px 61px}.question.open .qbody{display:block}.prompt{font-size:13px;line-height:1.65;color:#334155;margin:4px 0 12px}.codebox{border-radius:13px;overflow:hidden;background:#0b1220;margin:11px 0}.codehead{padding:9px 12px;background:#111827;border-bottom:1px solid #273449;color:#94a3b8;font-size:11px;display:flex;justify-content:space-between;align-items:center}.copy{border:1px solid #334155;background:#1f2937;color:#e2e8f0;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:800}pre{margin:0;padding:15px;color:#e2e8f0;overflow:auto;font:12.3px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}.tasks{padding-left:20px;margin:10px 0}.tasks li{font-size:12.5px;color:#334155;line-height:1.55;margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{border:0;border-radius:9px;padding:8px 11px;font-size:10.5px;font-weight:850}.btn-soft{background:#f1f5f9;color:#334155;border:1px solid var(--line)}.btn-done{background:#16a34a;color:#fff}.btn-done.completed{background:#dcfce7;color:#166534;border:1px solid #86efac}
.empty{padding:32px;text-align:center;color:#64748b;background:#fff;border:1px solid var(--line);border-radius:16px}footer{text-align:center;color:#64748b;font-size:11px;padding:30px}
@media(max-width:1050px){.outline{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;top:0;height:auto}.modules{display:grid;grid-template-columns:repeat(2,1fr)}.progress{display:none}}
@media(max-width:620px){.top{padding:0 14px}main{padding:14px}.course-tabs,.modules{grid-template-columns:1fr 1fr}.outline{grid-template-columns:repeat(2,1fr)}.hero{padding:24px}.chapter-head{align-items:flex-start;flex-direction:column}.qbody{padding-left:15px}}
</style>
</head>
<body>

  <div class="brand"><span class="logo">RRB</span><span>RRB Programming Academy<small>COURSE • MODULE • EXERCISE</small></span></div>

<script>
class ProgrammingAcademy {
  constructor() {
    this.data = [{"id": "java", "name": "Java Programming", "short": "JAVA", "icon": "☕", "subtitle": "OOP Concepts, Java Basics, GUI, Algorithms, Advanced, Database", "tools": "JDK 17+ • IntelliJ IDEA / NetBeans / VS Code", "modules": [{"no": "01", "title": "OOP Concepts", "desc": "Konsep dan paradigma Object-Oriented Programming.", "chapters": [{"title": "Class & Object", "desc": "Blueprint, instance, field, method.", "questions": [{"title": "Student Class", "prompt": "Buat class Student dan dua object.", "code": "public class Student {\n    String name;\n    String nim;\n    void show() { /* TODO */ }\n}", "tasks": ["Lengkapi show().", "Buat dua object.", "Tampilkan state masing-masing."], "level": "Dasar", "kind": "Implementasi"}, {"title": "Object State Trace", "prompt": "Analisis perubahan state object.", "code": "class Counter { int value; void inc(){ value++; } }\nCounter a=new Counter();\nCounter b=a;\na.inc();\nSystem.out.println(b.value);", "tasks": ["Prediksi output.", "Jelaskan aliasing reference.", "Buat versi dengan dua object terpisah."], "level": "Menengah", "kind": "Analisis"}, {"title": "Method Behavior", "prompt": "Tambahkan method hitung nilai stok.", "code": "class Product {\n    String name;\n    double price;\n    int stock;\n    // TODO\n}", "tasks": ["Buat inventoryValue().", "Return price*stock.", "Uji dua object."], "level": "Dasar", "kind": "Implementasi"}, {"title": "Object Array", "prompt": "Simpan object Student dalam array.", "code": "Student[] data = new Student[3];", "tasks": ["Isi tiga object.", "Iterasi dan panggil show().", "Cari student berdasarkan NIM."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Composition Intro", "prompt": "Buat Student memiliki Address.", "code": "class Address { String city; }\nclass Student { Address address; }", "tasks": ["Buat constructor.", "Isi nested object.", "Tampilkan city melalui Student."], "level": "Menengah", "kind": "Implementasi"}]}, {"title": "Constructor", "desc": "Default, parameterized, overloading, this().", "questions": [{"title": "Parameterized Constructor", "prompt": "Buat constructor Product.", "code": "class Product {\n    String name; double price;\n    // TODO\n}", "tasks": ["Isi field dengan this.", "Buat object.", "Tampilkan state."], "level": "Dasar", "kind": "Implementasi"}, {"title": "Constructor Overloading", "prompt": "Buat dua constructor.", "code": "class Student {\n    String name; int semester;\n    // TODO\n}", "tasks": ["Constructor name saja.", "Constructor name+semester.", "Gunakan this() untuk reuse."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Constructor Trace", "prompt": "Prediksi urutan constructor.", "code": "class A { A(){ System.out.println(\"A\"); } }\nclass B extends A { B(){ System.out.println(\"B\"); } }\nnew B();", "tasks": ["Tuliskan output.", "Jelaskan implicit super().", "Apa yang berubah bila A tidak punya no-arg constructor."], "level": "Menengah", "kind": "Analisis"}, {"title": "Validation in Constructor", "prompt": "Validasi harga tidak negatif.", "code": "class Product {\n    Product(double price) { /* TODO */ }\n}", "tasks": ["Tolak price<0.", "Gunakan IllegalArgumentException.", "Uji invalid input."], "level": "Menengah", "kind": "Implementasi"}]}, {"title": "Encapsulation", "desc": "Access control, getter, setter, validation.", "questions": [{"title": "Bank Account", "prompt": "Implementasikan encapsulation saldo.", "code": "class BankAccount {\n    private double balance;\n    // TODO\n}", "tasks": ["Buat deposit().", "Buat withdraw().", "Saldo tidak boleh negatif."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Validated Setter", "prompt": "Validasi semester.", "code": "class Student {\n    private int semester;\n    public void setSemester(int semester){ /* TODO */ }\n}", "tasks": ["Rentang 1-14.", "Throw exception jika invalid.", "Buat getter."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Immutable Object", "prompt": "Rancang class StudentId immutable.", "code": "final class StudentId {\n    private final String value;\n    // TODO\n}", "tasks": ["Field final.", "Tidak ada setter.", "Validasi constructor."], "level": "Sulit", "kind": "Implementasi"}, {"title": "Encapsulation Review", "prompt": "Analisis desain berikut.", "code": "class User {\n    public String password;\n}", "tasks": ["Jelaskan masalah.", "Ubah desain menjadi lebih aman.", "Jelaskan mengapa getter password juga bermasalah."], "level": "Menengah", "kind": "Analisis"}]}, {"title": "Inheritance", "desc": "extends, super, method reuse.", "questions": [{"title": "Employee Hierarchy", "prompt": "Buat Employee dan Lecturer.", "code": "class Employee { }\nclass Lecturer extends Employee { }", "tasks": ["Parent punya name,salary.", "Child punya nidn.", "Gunakan super constructor."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Protected Review", "prompt": "Analisis akses protected.", "code": "class Parent { protected int x=10; }\nclass Child extends Parent { void show(){ System.out.println(x); } }", "tasks": ["Tentukan validitas.", "Jelaskan protected.", "Bandingkan private."], "level": "Menengah", "kind": "Analisis"}, {"title": "Method Override", "prompt": "Override info().", "code": "class Vehicle { String info(){ return \"Vehicle\"; } }\nclass Car extends Vehicle { /* TODO */ }", "tasks": ["Gunakan @Override.", "Return info Car.", "Panggil melalui reference parent."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Inheritance vs Composition", "prompt": "Evaluasi relasi Car-Engine.", "code": "class Engine { }\nclass Car { /* extends Engine? */ }", "tasks": ["Pilih inheritance atau composition.", "Jelaskan alasan.", "Tuliskan desain class yang benar."], "level": "Sulit", "kind": "Analisis"}]}, {"title": "Polymorphism", "desc": "Dynamic dispatch, parent reference, override.", "questions": [{"title": "Shape Polymorphism", "prompt": "Buat Shape, Circle, Rectangle.", "code": "abstract class Shape { abstract double area(); }", "tasks": ["Override area().", "Simpan pada Shape[].", "Panggil area() dalam loop."], "level": "Sulit", "kind": "Implementasi"}, {"title": "Runtime Dispatch", "prompt": "Prediksi output.", "code": "class A { void show(){System.out.print(\"A\");} }\nclass B extends A { void show(){System.out.print(\"B\");} }\nA x = new B();\nx.show();", "tasks": ["Tentukan output.", "Jelaskan runtime dispatch.", "Bedakan reference type dan object type."], "level": "Menengah", "kind": "Analisis"}, {"title": "Upcasting", "prompt": "Demonstrasikan upcasting.", "code": "Dog d = new Dog();\nAnimal a = d;", "tasks": ["Jelaskan mengapa valid.", "Panggil method override.", "Jelaskan akses method khusus Dog dari reference Animal."], "level": "Menengah", "kind": "Analisis"}, {"title": "Downcasting Safety", "prompt": "Gunakan instanceof sebelum cast.", "code": "Animal a = new Dog();\n// TODO safe downcast", "tasks": ["Gunakan instanceof.", "Panggil method khusus Dog.", "Jelaskan ClassCastException."], "level": "Sulit", "kind": "Implementasi"}]}, {"title": "Abstract Class & Interface", "desc": "Abstraction, contract, multiple interface.", "questions": [{"title": "Payment Interface", "prompt": "Buat dua payment method.", "code": "interface PaymentMethod { boolean pay(double amount); }", "tasks": ["EWallet dan Transfer.", "Validasi amount.", "Gunakan method process(PaymentMethod)."], "level": "Sulit", "kind": "Implementasi"}, {"title": "Abstract Template", "prompt": "Buat abstract Report.", "code": "abstract class Report {\n    abstract String generate();\n}", "tasks": ["Buat PdfReport dan TextReport.", "Override generate().", "Simpan dalam list Report."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Multiple Interfaces", "prompt": "Implementasikan Printable dan Savable.", "code": "interface Printable { void print(); }\ninterface Savable { void save(); }", "tasks": ["Satu class implements keduanya.", "Panggil melalui tiap interface.", "Jelaskan multiple inheritance of type."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Default Method", "prompt": "Eksperimen default method interface.", "code": "interface Loggable {\n    default void log(){ System.out.println(\"log\"); }\n}", "tasks": ["Implementasikan interface.", "Override default method.", "Jelaskan kapan default method berguna."], "level": "Sulit", "kind": "Implementasi"}]}]}, {"no": "02", "title": "Java Basics", "desc": "Sintaks, grammar, tipe data, operator, control flow, array, method, dan package.", "chapters": [{"title": "Program Structure & Syntax", "desc": "Struktur class, main method, statement, block, comment, dan aturan dasar sintaks Java.", "questions": [{"title": "Perbaiki Program Java", "prompt": "Temukan dan perbaiki kesalahan sintaks.", "code": "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello Java\")\n        int x = 10\n        System.out.println(x);\n    }\n}", "tasks": ["Identifikasi seluruh kesalahan sintaks.", "Tuliskan versi yang dapat dikompilasi.", "Jelaskan fungsi tanda titik koma."], "level": "Dasar", "kind": "Analisis"}, {"title": "Execution Order", "prompt": "Prediksi urutan output program.", "code": "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"A\");\n        {\n            System.out.println(\"B\");\n        }\n        System.out.println(\"C\");\n    }\n}", "tasks": ["Tuliskan output.", "Jelaskan fungsi block `{}`.", "Apakah block tersebut membuat method baru."], "level": "Dasar", "kind": "Analisis"}, {"title": "Comment dan Statement", "prompt": "Kelompokkan bagian kode menjadi comment dan executable statement.", "code": "// start\nint a = 10;\n/* calculate */\nint b = a * 2;\nSystem.out.println(b);", "tasks": ["Tandai comment single-line dan multi-line.", "Hitung jumlah executable statement.", "Tuliskan output."], "level": "Dasar", "kind": "Analisis"}, {"title": "Identifier Validity", "prompt": "Analisis nama identifier berikut.", "code": "int studentScore = 90;\nint _count = 2;\n// int 2score = 10;\n// int class = 1;", "tasks": ["Tentukan identifier valid.", "Jelaskan aturan identifier Java.", "Buat lima contoh identifier yang baik."], "level": "Dasar", "kind": "Analisis"}, {"title": "Main Method", "prompt": "Jelaskan mengapa signature main berikut penting.", "code": "public static void main(String[] args) {\n    System.out.println(\"Run\");\n}", "tasks": ["Jelaskan public, static, void.", "Jelaskan String[] args.", "Tuliskan alternatif `String... args`."], "level": "Menengah", "kind": "Analisis"}]}, {"title": "Variables, Data Types & Casting", "desc": "Primitive type, reference type, literal, scope, casting, dan overflow sederhana.", "questions": [{"title": "Primitive Type Selection", "prompt": "Pilih tipe data paling tepat untuk setiap kebutuhan.", "code": "// umur\n// IPK\n// status aktif\n// satu karakter grade\n// jumlah penduduk", "tasks": ["Tentukan tipe untuk lima data.", "Jelaskan alasan pemilihan.", "Buat deklarasi valid."], "level": "Dasar", "kind": "Analisis"}, {"title": "Casting Trace", "prompt": "Prediksi output casting.", "code": "int a = 7;\ndouble b = a / 2;\ndouble c = (double) a / 2;\nSystem.out.println(b);\nSystem.out.println(c);", "tasks": ["Tentukan output.", "Jelaskan integer division.", "Jelaskan widening dan explicit casting."], "level": "Menengah", "kind": "Analisis"}, {"title": "Char Numeric Value", "prompt": "Analisis konversi char ke int.", "code": "char grade = 'A';\nint code = grade;\nSystem.out.println(code);", "tasks": ["Tentukan output.", "Jelaskan numeric value char.", "Ubah code kembali ke char."], "level": "Menengah", "kind": "Analisis"}, {"title": "Scope", "prompt": "Tentukan variabel mana yang dapat diakses.", "code": "int a = 10;\nif (a > 5) {\n    int b = 20;\n    System.out.println(a + b);\n}\n// System.out.println(b);", "tasks": ["Jelaskan scope a dan b.", "Jelaskan mengapa baris terakhir bermasalah.", "Buat versi yang valid."], "level": "Menengah", "kind": "Analisis"}, {"title": "Overflow", "prompt": "Analisis overflow integer.", "code": "int x = Integer.MAX_VALUE;\nx++;\nSystem.out.println(x);", "tasks": ["Prediksi output.", "Jelaskan overflow.", "Sebutkan tipe alternatif bila rentang int tidak cukup."], "level": "Sulit", "kind": "Analisis"}, {"title": "Reference vs Primitive", "prompt": "Bandingkan assignment primitive dan object sederhana.", "code": "int a = 10;\nint b = a;\nb = 20;\nSystem.out.println(a);", "tasks": ["Tentukan output.", "Jelaskan copy value pada primitive.", "Bandingkan secara konsep dengan reference object."], "level": "Menengah", "kind": "Analisis"}]}, {"title": "Operators", "desc": "Arithmetic, assignment, increment/decrement, relational, logical, ternary, casting, precedence, dan bitwise.", "questions": [{"title": "Mixed Operators dan Short-Circuit", "prompt": "Analisis program berikut secara manual. Fokus pada urutan evaluasi, efek pre/post increment-decrement, serta short-circuit evaluation.", "code": "public class Main {\n    public static void main(String[] args) {\n        int a = 5;\n        int b = 8;\n        int c = 3;\n\n        int x = a++ + --b * c;\n        int y = ++a % c + b--;\n\n        boolean z = x > y && a > b || ++c == 4;\n\n        System.out.println(\"a = \" + a);\n        System.out.println(\"b = \" + b);\n        System.out.println(\"c = \" + c);\n        System.out.println(\"x = \" + x);\n        System.out.println(\"y = \" + y);\n        System.out.println(\"z = \" + z);\n    }\n}", "tasks": ["Tentukan urutan evaluasi operator yang terjadi.", "Catat perubahan nilai a, b, dan c pada setiap tahap.", "Tentukan nilai x, y, dan z.", "Jelaskan apakah ekspresi ++c == 4 dieksekusi atau tidak, beserta alasannya.", "Tuliskan seluruh output akhir program."], "level": "Sulit", "kind": "Analisis"}, {"title": "Logical Chain dengan Increment dan Decrement", "prompt": "Tentukan hasil evaluasi ekspresi boolean dan nilai akhir setiap variabel.", "code": "public class Main {\n    public static void main(String[] args) {\n        int x = 5;\n        int y = 7;\n\n        boolean result =\n            (++x > 5) &&\n            (y-- > 5) &&\n            (++x + y > 12);\n\n        System.out.println(\"x = \" + x);\n        System.out.println(\"y = \" + y);\n        System.out.println(\"result = \" + result);\n    }\n}", "tasks": ["Tuliskan nilai x dan y sebelum serta sesudah setiap operand boolean dievaluasi.", "Tentukan operand mana yang menyebabkan proses evaluasi berhenti, jika ada.", "Tuliskan output akhir program."], "level": "Sulit", "kind": "Analisis"}, {"title": "Prediksi Output Kompleks", "prompt": "Analisis perubahan state program dari baris ke baris tanpa bantuan compiler.", "code": "public class Main {\n    public static void main(String[] args) {\n        int x = 4;\n        int y = 6;\n\n        int a = x++ * 2;\n        int b = ++x + --y;\n        boolean c = a > b || ++y > x;\n\n        System.out.println(x);\n        System.out.println(y);\n        System.out.println(a);\n        System.out.println(b);\n        System.out.println(c);\n    }\n}", "tasks": ["Buat execution trace untuk x, y, a, dan b.", "Jelaskan perbedaan efek x++ dan ++x pada program.", "Tentukan apakah ++y pada ekspresi boolean dieksekusi.", "Tuliskan seluruh output program dalam urutan yang benar."], "level": "Sulit", "kind": "Analisis"}, {"title": "Operator Campuran dan Perubahan Operand", "prompt": "Perhatikan bahwa nilai operand dapat berubah di tengah ekspresi. Tentukan output program secara tepat.", "code": "public class Main {\n    public static void main(String[] args) {\n        int a = 6;\n        int b = 4;\n\n        int c = ++a * b-- + a % b;\n        boolean d = c > 20 && a != b;\n\n        System.out.println(\"a = \" + a);\n        System.out.println(\"b = \" + b);\n        System.out.println(\"c = \" + c);\n        System.out.println(\"d = \" + d);\n    }\n}", "tasks": ["Tentukan nilai a dan b setelah operasi ++a dan b--.", "Jelaskan nilai b yang digunakan pa kan perbedaan short-circuit pada && dan evaluasi kedua operand pada & ketika digunakan terhadap boolean."], "level": "Menengah", "kind": "Analisis"}, {"title": "Short-Circuit dengan Side Effect", "prompt": "Program berikut mengandung side effect pada operand kedua dari operator &&.", "code": "public class Main {\n    public static void main(String[] args) {\n        int x = 5;\n        int y = 10;\n\n        boolean result = (x > 10) && (++y > 10);\n\n        System.out.println(result);\n        System.out.println(y);\n    }\n}", "tasks": ["Tentukan nilai result dan y.", "Jelaskan mengapa perubahan nilai y bergantung pada hasil operand pertama.", "Tuliskan bagaimana hasilnya berubah jika operator && diganti menjadi &."], "level": "Menengah", "kind": "Analisis"}, {"title": "Precedence: Relational dan Logical Operator", "prompt": "Tentukan hasil ekspresi berikut dengan menunjukkan pengelompokan operator yang dilakukan Java.", "code": "public class Main {\n    public static void main(String[] args) {\n        int a = 8;\n        int b = 12;\n        int c = 8;\n\n        boolean result = a < b && a == c || b < c;\n\n        System.out.println(result);\n    }\n}", "tasks": ["Tentukan output program.", "Tuliskan kembali ekspresi dengan tanda kurung sesuai operator precedence Java.", "Tunjukkan nilai boolean dari setiap sub-ekspresi relational sebelum operator logical digabungkan."], "level": "Menengah", "kind": "Analisis"}, {"title": "Bitwise AND, OR, dan XOR", "prompt": "Kerjakan menggunakan representasi biner. Perhitungan langsung dalam desimal tidak dianggap sebagai proses lengkap.", "code": "public class Main {\n    public static void main(String[] args) {\n        int a = 10;\n        int b = 6;\n\n        System.out.println(a & b);\n        System.out.println(a | b);\n        System.out.println(a ^ b);\n    }\n}", "tasks": ["Konversikan a dan b ke biner 8-bit.", "Lakukan operasi bitwise AND, OR, dan XOR per bit.", "Konversikan setiap hasil kembali ke desimal.", "Tu "tasks": ["Lengkapi TODO.", "Gunakan C++17 atau lebih baru.", "Uji minimal tiga skenario."], "level": "Menengah", "kind": "Implementasi"}, {"title": "Iterator Debugging", "prompt": "Temukan dan perbaiki masalah pada kode Iterator.", "code": "for(auto it=v.begin();it!=v.end();++it){}", "tasks": ["Identifikasi kesalahan.", "Perbaiki kode.", "Jelaskan undefined/undesired behavior bila relevan."], "level": "Sulit", "kind": "Analisis"}, {"title": "Iterator Challenge", "prompt": "Selesaikan mini challenge Iterator.", "code": "for(auto it=v.begin();it!=v.end();++it){}", "tasks": ["Buat program lengkap.", "Tangani edge case.", "Catat output uji."], "level": "Sulit", "kind": "Implementasi"}]}]}]}];
    this.progressKey = "rrb_academy_progress_v7";
    this.completed = new Set(JSON.parse(localStorage.getItem(this.progressKey) || "[]"));
    this.courseId = "java";
    this.moduleId = "java".startsWith("java") ? null : null;
    this.courseId = this.data[0].id;
    this.moduleId = this.data[0].modules[0].title;
    this.courseTabs = document.getElementById("courseTabs");
    this.moduleList = document.getElementById("moduleList");
    this.content = document.getElementById("content");
    this.search = document.getElementById("search");
    this.search.addEventListener("input", () => this.renderModules());
    this.render();
  }
  get course() { return this.data.find(c => c.id === this.courseId); }
  get module() { return this.course.modules.find(m => m.title === this.moduleId) || this.course.modules[0]; }
  key(ci, qi) { return `${this.courseId}|${this.module.no}|${ci}|${qi}`; }

  render() {
    this.renderCourses();
    this.renderModules();
    this.renderContent();
    this.updateProgress();
  }

  renderCourses() {
    this.courseTabs.innerHTML = "";
    this.data.forEach(c => {
      const b = document.createElement("button");
      b.className = "course-tab" + (c.id === this.courseId ? " active" : "");
      b.textContent = `${c.icon} ${c.short}`;
      b.title = c.name;
      b.onclick = () => {
        this.courseId = c.id;
        this.moduleId = c.modules[0].title;
        this.search.value = "";
        this.render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
      this.courseTabs.appendChild(b);
    });
  }

  renderModules() {
    const q = this.search.value.trim().toLowerCase();
    this.moduleList.innerHTML = "";
    const list = this.course.modules.filter(m => !q || (m.title+" "+m.desc+" "+m.chapters.map(ch=>ch.title).join(" ")).toLowerCase().includes(q));
    if(!list.length) {
      this.moduleList.innerHTML='<div style="font-size:12px;color:#64748b;padding:10px">Materi tidak ditemukan.</div>';
      return;
    }
    list.forEach(m => {
      const b = document.createElement("button");
      b.className = "module-btn" + (m.title === this.module.title ? " active" : "");
      const allDone = m.chapters.every((ch,ci)=>ch.questions.every((_,qi)=>this.completed.has(`${this.courseId}|${m.no}|${ci}|${qi}`)));
      b.innerHTML = `<span class="mnum">${m.no}</span><span class="mtitle">${m.title}</span><span class="mcheck">${allDone?"✓":""}</span>`;
      b.onclick=()=>{this.moduleId=m.title;this.render();window.scrollTo({top:0,behavior:"smooth"});};
      this.moduleList.appendChild(b);
    });
  }

  renderContent() {
    const c=this.course,m=this.module;
    const totalQuestions=m.chapters.reduce((s,ch)=>s+ch.questions.length,0);
    this.content.innerHTML=`
      <section class="hero">
        <div class="eyebrow">${c.name} • Course Outline</div>
        <h1>${c.name}</h1>
        <p>${c.subtitle}</p>
        <div class="pills">
          <span class="pill">${c.modules.length} major modules</span>
          <span class="pill">${c.modules.reduce((s,x)=>s+x.chapters.length,0)} subbab</span>
          <span class="pill">Maks. 10 soal / subbab</span>
          <span class="pill">${c.tools}</span>
        </div>
      </section>

      <section class="outline">
        ${c.modules.map(x=>`<div class="outline-item ${x.title===m.title?"active":""}" data-module="${this.escapeAttr(x.title)}"><div class="onum">${x.no}</div><div class="otitle">${x.title}</div></div>`).join("")}
      </section>

      
    `;

    this.content.querySelectorAll("[data-module]").forEach(el=>el.onclick=()=>{
      this.moduleId=el.dataset.module;this.render();window.scrollTo({top:0,behavior:"smooth"});
    });

    const chapters=document.getElementById("chapters");
    m.chapters.forEach((ch,ci)=>{
      const section=document.createElement("section");
      section.className="chapter";
      section.innerHTML=`
        <div class="chapter-head">
          <div><h3>${ci+1}. ${ch.title}</h3><p>${ch.desc}</p></div>
          <span class="qcount">${ch.questions.length} soal</span>
        </div>
        <div class="question-list" id="chapter-${ci}"></div>`;
      chapters.appendChild(section);
      const list=section.querySelector(".question-list");

      ch.questions.forEach((question,qi)=>{
        const k=this.key(ci,qi);
        const item=document.createElement("article");
        item.className="question";
        item.innerHTML=`
          <button class="qhead" data-toggle>
            <span class="qno">${qi+1}</span>
            <span><span class="qtitle">${question.title}</span><span class="qmeta">${question.kind} • ${question.level}${this.completed.has(k)?" • ✓ selesai":""}</span></span>
            <span class="arrow">▼</span>
          </button>
          <div class="qbody">
            <p class="prompt">${question.prompt}</p>
            ${question.code ? `<div class="codebox"><div class="codehead"><span>Source / Starter Code</span><button class="copy" data-copy>Copy Code</button></div><pre>${this.escape(question.code)}</pre></div>` : ""}
            <ol class="tasks">${question.tasks.map(t=>`<li>${t}</li>`).join("")}</ol>
            <div class="actions">
              <button class="btn btn-soft" data-copyq>Copy Soal</button>
              <button class="btn btn-done ${this.completed.has(k)?"completed":""}" data-done>${this.completed.has(k)?"✓ Selesai":"Tandai Selesai"}</button>
            </div>
          </div>`;
        list.appendChild(item);

        item.querySelector("[data-toggle]").onclick=()=>item.classList.toggle("open");
        const copy=item.querySelector("[data-copy]");
        if(copy) copy.onclick=(e)=>{
          e.stopPropagation();navigator.clipboard.writeText(question.code);
          const old=copy.textContent;copy.textContent="Copied";setTimeout(()=>copy.textContent=old,900);
        };
        item.querySelector("[data-copyq]").onclick=()=>{
          const txt=question.title+"\n\n"+question.prompt+"\n\n"+question.code+"\n\n"+question.tasks.map((t,i)=>(i+1)+". "+t).join("\n");
          navigator.clipboard.writeText(txt);
        };
        item.querySelector("[data-done]").onclick=()=>{
          if(this.completed.has(k))this.completed.delete(k);else this.completed.add(k);
          localStorage.setItem(this.progressKey,JSON.stringify([...this.completed]));
          this.renderModules();this.renderContent();this.updateProgress();
        };
      });
    });
  }

  updateProgress() {
    const total=this.data.reduce((a,c)=>a+c.modules.reduce((b,m)=>b+m.chapters.reduce((d,ch)=>d+ch.questions.length,0),0),0);
    const done=this.completed.size;
    document.getElementById("progressText").textContent=`${done}/${total}`;
    document.getElementById("progressFill").style.width=Math.round(done/total*100)+"%";
  }

  escape(s) {
    return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  }
  escapeAttr(s) {
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
  }
}
new ProgrammingAcademy();
</script>
